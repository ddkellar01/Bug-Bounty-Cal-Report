name: Docker Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  push_to_registries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            credkellar/bug-bounty-cal-report:latest
            credkellar/vulnerabilitiesx:bug-bounty-cal-report
            credkellar/monad-vul-x:bug-bounty-cal-report
