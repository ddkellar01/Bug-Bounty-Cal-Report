[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-bounty-cal-report"
version = "1.0.0"
description = "Bug bounty CVSS calculator and report generator with a FastAPI server."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

# The code lives in a package literally named "src" (imports look like
# `from src.modules.cvss_calculator import ...`), so packages are found
# from the repo root, NOT via a src-layout package-dir remap. Remapping
# package-dir to "src" is what broke these imports in CI.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]