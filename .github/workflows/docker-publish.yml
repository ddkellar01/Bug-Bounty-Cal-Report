name: Docker Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Multi-Registry Containers
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            credkellar/bug-bounty-cal-report:latest
            credkellar/iso-iecx:latest
            credkellar/vulnerabilitiesx:latest
            credkellar/monad-vul-x:latest
            credkellar/bug-bounty-cal-report:${{ github.sha }}
            credkellar/iso-iecx:${{ github.sha }}
